name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [account, auth, transaction]

    defaults:
      run:
        working-directory: ./${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Debug npm
        run: |
          echo "=== Environment ==="
          node -v
          npm -v
          npm config get prefix
          npm config get cache
      
          echo "=== Git ==="
          git rev-parse HEAD
          git status --short
      
          echo "=== package.json ==="
          node -p "require('./package.json').devDependencies.typescript"
      
          echo "=== package-lock root ==="
          node -p "require('./package-lock.json').packages[''].devDependencies.typescript"
      
          echo "=== package-lock TypeScript ==="
          node -p "require('./package-lock.json').packages['node_modules/typescript'].version"
      
          echo "=== Search TypeScript 5.9.3 in repository ==="
          git grep -n "5.9.3" || true
      
          echo "=== npm config ==="
          npm config list
      
          echo "=== npm prefix ==="
          npm prefix
      
          echo "=== npm package root ==="
          npm root

      - name: Find TypeScript 5.9.3
        run: |
          echo "=== All package.json files ==="
          find .. -name package.json -print
      
          echo "=== All package-lock.json files ==="
          find .. -name package-lock.json -print
      
          echo "=== Search exact 5.9.3 in package files ==="
          grep -R -n --include="package.json" --include="package-lock.json" '"5.9.3"' .. || true
      
          echo "=== Search TypeScript references ==="
          grep -R -n --include="package.json" --include="package-lock.json" 'typescript' .. || true
      
          echo "=== npm package tree ==="
          npm ls typescript --all || true

      - name: Check root package
        run: |
          echo "=== Root package.json ==="
          if [ -f ../package.json ]; then
            cat ../package.json
          else
            echo "No root package.json"
          fi
      
          echo "=== Root package-lock.json ==="
          if [ -f ../package-lock.json ]; then
            cat ../package-lock.json | head -80
          else
            echo "No root package-lock.json"
          fi
      
      - name: Install dependencies
        run: npm ci --verbose

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test
        continue-on-error: true
