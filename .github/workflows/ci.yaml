name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [account, auth, transaction]

    defaults:
      run:
        working-directory: ./${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Debug dependencies
        run: |
          echo "Working directory:"
          pwd
      
          echo "Git commit:"
          git rev-parse HEAD
      
          echo "package.json:"
          cat package.json
      
          echo "TypeScript in package.json:"
          node -p "require('./package.json').devDependencies?.typescript"
      
          echo "TypeScript in package-lock.json:"
          node -p "require('./package-lock.json').packages[''].devDependencies?.typescript"
      
          echo "TypeScript lock entry:"
          node -p "require('./package-lock.json').packages['node_modules/typescript']?.version"
      
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test
        continue-on-error: true
