name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [account, auth, transaction]

    defaults:
      run:
        working-directory: ./${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Debug CI environment
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== FILES ==="
          ls -la
          echo "=== package.json typescript ==="
          grep typescript package.json
          echo "=== package-lock.json typescript ==="
          grep -A2 '"node_modules/typescript"' package-lock.json || echo "NOT FOUND"
          echo "=== git commit ==="
          git log -1 --format="%H %s"
          echo "=== git branch ==="
          git branch --show-current
      
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test
        continue-on-error: true
