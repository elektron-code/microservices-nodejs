apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.k8s.yaml -o k8s/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: transaction
  name: transaction
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: transaction
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.k8s.yaml -o k8s/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: transaction
    spec:
      containers:
        - env:
            - name: DB_DATABASE
              value: transaction-db
            - name: DB_ENTITIES
              value: dist/**/*.entity.js
            - name: DB_HOST
              value: postgres
            - name: DB_LOGGING
              value: "false"
            - name: DB_MIGRATIONS
              value: dist/module/database/migrations/*.js
            - name: DB_MIGRATIONS_RUN
              value: "false"
            - name: DB_PASSWORD
              value: password
            - name: DB_PORT
              value: "5432"
            - name: DB_TYPE
              value: postgres
            - name: DB_USERNAME
              value: postgres
            - name: HTTP_HOST
              value: 0.0.0.0
            - name: HTTP_PORT
              value: "9002"
            - name: HTTP_PREFIX
              value: /api/transaction
            - name: HTTP_VERSION
              value: "1"
            - name: KAFKA_CLIENT_BROKERS
              value: kafka:9092
            - name: KAFKA_CLIENT_ID
              value: transaction
            - name: KAFKA_CONSUMER_GROUP_ID
              value: transaction-consumer
            - name: SERVICE_NAME
              value: transaction
          image: elektroncode/microservices-transaction:latest
          name: transaction
          ports:
            - containerPort: 9002
              protocol: TCP
      restartPolicy: Always
