apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.k8s.yaml -o k8s/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: account
  name: account
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: account
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.k8s.yaml -o k8s/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: account
    spec:
      containers:
        - env:
            - name: DB_DATABASE
              value: account-db
            - name: DB_ENTITIES
              value: dist/**/*.entity.js
            - name: DB_HOST
              value: postgres
            - name: DB_LOGGING
              value: "false"
            - name: DB_MIGRATIONS
              value: dist/module/database/migrations/*.js
            - name: DB_MIGRATIONS_RUN
              value: "false"
            - name: DB_PASSWORD
              value: password
            - name: DB_PORT
              value: "5432"
            - name: DB_TYPE
              value: postgres
            - name: DB_USERNAME
              value: postgres
            - name: HTTP_HOST
              value: 0.0.0.0
            - name: HTTP_PORT
              value: "9000"
            - name: HTTP_PREFIX
              value: /api/account
            - name: HTTP_VERSION
              value: "1"
            - name: KAFKA_CLIENT_BROKERS
              value: kafka:9092
            - name: KAFKA_CLIENT_ID
              value: account
            - name: KAFKA_CONSUMER_GROUP_ID
              value: account-consumer
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PASSWORD
              value: password
            - name: REDIS_PORT
              value: "6379"
            - name: SERVICE_NAME
              value: account
          image: elektroncode/microservices-account:latest
          name: account
          ports:
            - containerPort: 9000
              protocol: TCP
      restartPolicy: Always
