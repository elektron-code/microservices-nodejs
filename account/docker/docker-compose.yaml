version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: book-db-postgres
    ports: [ "5432:5432" ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: account-db
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    restart: unless-stopped